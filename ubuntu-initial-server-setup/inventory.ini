# =====================================================================
# Ansible Inventory for Ubuntu Server Hardening
# =====================================================================
# Usage:
#   ansible-playbook -i inventory.ini harden.yml
#
# Notes:
#   - Replace IPs, usernames, and key paths with your actual values.
#   - All hosts must be reachable via SSH from the Ansible control node.
#   - The SSH user must have sudo privileges (passwordless sudo recommended).
# =====================================================================

[ubuntu_servers]
# Single server example
server1 ansible_host=192.168.1.100

# Multiple servers example (uncomment and adjust as needed)
# server2 ansible_host=192.168.1.101
# server3 ansible_host=192.168.1.102


[ubuntu_servers:vars]
# ---- Connection Settings ----
ansible_user=deploy
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3

# ---- SSH Options ----
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# ---- Privilege Escalation ----
ansible_become=true
ansible_become_method=sudo
ansible_become_user=root
# If sudo requires a password, uncomment the next line and use ansible-vault:
# ansible_become_pass={{ vault_sudo_password }}
