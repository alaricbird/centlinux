---
- name: Initialize Kubernetes cluster
  shell: |
    kubeadm init \
      --pod-network-cidr={{ pod_network_cidr }} \
      --service-cidr={{ service_cidr }}
  args:
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init
  tags: control-plane

- name: Create .kube directory for user
  file:
    path: ~/.kube
    state: directory
    mode: '0755'
  tags: control-plane

- name: Copy admin.conf to user home
  copy:
    src: /etc/kubernetes/admin.conf
    dest: ~/.kube/config
    remote_src: yes
    mode: '0644'
  tags: control-plane

- name: Set ownership for kubeconfig
  shell: |
    chown $(id -u):$(id -g) ~/.kube/config
  tags: control-plane

- name: Extract join command for workers
  shell: |
    kubeadm token create --print-join-command
  register: join_command
  run_once: true
  tags: control-plane

- name: Store join command in variable
  set_fact:
    worker_join_command: "{{ join_command.stdout }}"
  run_once: true
  tags: control-plane

- name: Debug join command
  debug:
    msg: "Worker join command: {{ worker_join_command }}"
  run_once: true
  tags: control-plane

- name: Install Calico CNI
  shell: |
    kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/{{ kubernetes_cni_version }}/manifests/calico.yaml
  register: calico_install
  tags: control-plane

- name: Wait for Calico pods to start
  shell: |
    kubectl get pods -n kube-system -l k8s-app=calico-node --no-headers | wc -l
  register: calico_pods
  until: calico_pods.stdout|int > 0
  retries: 30
  delay: 10
  tags: control-plane

- name: Label control plane node
  shell: |
    kubectl label node {{ inventory_hostname }} node-role.kubernetes.io/control-plane= --overwrite
  tags: control-plane

- name: Generate join command file for workers
  copy:
    content: "{{ worker_join_command }}"
    dest: /tmp/join-command.txt
    mode: '0644'
  tags: control-plane